<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Encuesta — ¿Quién hace este trabajo?</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/estilos.css?v=5" rel="stylesheet">
</head>
<body class="fondo-alegre">
  <a class="saltar-contenido" href="#principal">Saltar al contenido</a>

  <main id="principal" class="container py-3 py-md-4" style="max-width:1080px">

    <!-- Cargando -->
    <div id="cargando" class="text-center py-5">
      <div class="spinner-border" style="color:var(--morado); width:3rem; height:3rem" role="status">
        <span class="visually-hidden">Cargando…</span>
      </div>
      <p class="fw-bold mt-3 mb-0">Preparando las preguntas…</p>
    </div>

    <!-- Errores y avisos -->
    <div id="avisos" class="oculto mb-3"></div>

    <!-- La encuesta -->
    <section id="encuesta" class="oculto">

      <!-- Solo aparece en la segunda vuelta, para que el niño sepa dónde está -->
      <div class="cinta-momento oculto mb-3" id="cinta-momento">
        <span aria-hidden="true">💭</span>
        Segunda vuelta: responde otra vez, ahora que ya conoces sus historias.
      </div>

      <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="texto-progreso" id="texto-progreso">Pregunta 1 de 15</span>
        <a href="index.html?v=5" class="text-decoration-none fw-bold" style="color:var(--gris)">Salir</a>
      </div>

      <div class="progress barra-progreso mb-4" role="progressbar"
           aria-label="Avance de la encuesta" aria-valuemin="0" aria-valuemax="100"
           id="contenedor-progreso" aria-valuenow="0">
        <div class="progress-bar" id="barra" style="width:0%"></div>
      </div>

      <div class="tablero">

        <div class="marco-imagen">
          <span class="etiqueta-trabajo" id="etiqueta-trabajo">Trabajo 1 de 5</span>
          <img id="foto" src="" alt="Foto de una persona trabajando, sin que se vea su rostro."
               loading="eager" decoding="async">
        </div>

        <div>
          <h1 class="pregunta-texto mb-4" id="texto-pregunta">…</h1>

          <div class="lista-opciones mb-4" id="opciones" role="group"
               aria-labelledby="texto-pregunta"></div>

          <div class="d-flex justify-content-between align-items-center gap-2 flex-wrap">
            <button class="btn btn-secundario" id="btn-anterior" type="button">← Anterior</button>
            <button class="btn btn-principal" id="btn-siguiente" type="button" disabled>
              <span class="spinner-border spinner-border-sm me-2 oculto" id="spinner-siguiente"
                    role="status" aria-hidden="true"></span>
              <span id="texto-siguiente">Siguiente →</span>
            </button>
          </div>

          <p class="nota-encuesta text-center mt-3 mb-0"
             style="color:var(--gris); font-size:.95rem">
            Recuerda: no hay respuestas correctas ni incorrectas.
          </p>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    import {
      cargarContenido, aplanarPasos, guardarRespuesta, completarSesion,
      idSesion, respuestasLocales, indiceGuardado, guardarIndice,
      momentoActual, historiasVistas,
      avisarSiFaltaConfiguracion, mostrarError, limpiarError
    } from './assets/js/encuesta.js?v=5';

    const $ = (id) => document.getElementById(id);

    const cargando   = $('cargando');
    const avisos     = $('avisos');
    const seccion    = $('encuesta');
    const foto       = $('foto');
    const etiqueta   = $('etiqueta-trabajo');
    const barra      = $('barra');
    const contBarra  = $('contenedor-progreso');
    const textoProg  = $('texto-progreso');
    const textoPreg  = $('texto-pregunta');
    const listaOpc   = $('opciones');
    const btnAnt     = $('btn-anterior');
    const btnSig     = $('btn-siguiente');
    const spinnerSig = $('spinner-siguiente');
    const textoSig   = $('texto-siguiente');

    let pasos = [];          // las 15 pantallas
    let indice = 0;          // en cuál estamos
    let elegidas = {};       // { preguntaId: opcionId }
    let bloqueActual = null; // para no recargar la foto en cada pregunta
    let momento = 'antes';   // 'antes' o 'despues': las dos vueltas

    /* ------------------------------------------------------ Arranque --- */

    async function iniciar() {
      if (avisarSiFaltaConfiguracion(avisos)) {
        cargando.classList.add('oculto');
        return;
      }

      // Sin sesión no se puede guardar nada: se vuelve a la portada.
      if (!idSesion()) {
        window.location.replace('index.html?v=5');
        return;
      }

      try {
        // La segunda vuelta solo empieza después de ver las historias.
        momento = momentoActual();
        if (momento === 'despues' && !historiasVistas()) {
          window.location.replace('historias.html?v=5');
          return;
        }
        $('cinta-momento').classList.toggle('oculto', momento !== 'despues');

        const bloques = await cargarContenido();
        pasos = aplanarPasos(bloques);
        elegidas = respuestasLocales(momento);

        // Retomamos donde se quedó, sin pasarnos del final.
        indice = Math.min(Math.max(indiceGuardado(momento), 0), pasos.length - 1);

        cargando.classList.add('oculto');
        seccion.classList.remove('oculto');
        pintar();
      } catch (error) {
        cargando.classList.add('oculto');
        mostrarError(avisos, error);
      }
    }

    /* ------------------------------------------------------- Pintado --- */

    function pintar() {
      const paso = pasos[indice];

      // La foto solo cambia cuando cambiamos de trabajo.
      if (bloqueActual !== paso.bloque.id) {
        bloqueActual = paso.bloque.id;
        foto.src = 'assets/img/' + paso.bloque.imagen;
        etiqueta.textContent = `Trabajo ${paso.numeroBloque} de ${pasos.length / 3}`;
        precargarSiguienteFoto();
      }

      // Progreso.
      const numero = indice + 1;
      const porcentaje = Math.round((numero / pasos.length) * 100);
      textoProg.textContent = `Pregunta ${numero} de ${pasos.length}`;
      barra.style.width = porcentaje + '%';
      contBarra.setAttribute('aria-valuenow', String(porcentaje));

      // Pregunta y opciones.
      textoPreg.textContent = paso.pregunta.texto;
      listaOpc.innerHTML = '';
      paso.pregunta.opciones.forEach((opcion) => {
        listaOpc.appendChild(crearBotonOpcion(paso.pregunta, opcion));
      });

      // Navegación.
      btnAnt.disabled = indice === 0;
      const esUltima = indice === pasos.length - 1;
      textoSig.textContent = esUltima
        ? (momento === 'antes' ? 'Continuar →' : '¡Terminar! 🎉')
        : 'Siguiente →';
      btnSig.disabled = !elegidas[paso.pregunta.id];

      guardarIndice(indice, momento);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /** Un botón grande por opción, con su emoji. */
    function crearBotonOpcion(pregunta, opcion) {
      const boton = document.createElement('button');
      boton.type = 'button';
      boton.className = 'opcion';
      boton.setAttribute('aria-pressed', String(elegidas[pregunta.id] === opcion.id));
      if (elegidas[pregunta.id] === opcion.id) boton.classList.add('elegida');

      boton.innerHTML =
        `<span class="emoji" aria-hidden="true">${opcion.emoji || '•'}</span>
         <span>${opcion.texto}</span>`;

      boton.addEventListener('click', () => elegir(pregunta, opcion.id));
      return boton;
    }

    /** Marca la opción elegida. No dice si es correcta: es una opinión. */
    function elegir(pregunta, opcionId) {
      elegidas[pregunta.id] = opcionId;
      limpiarError(avisos);

      Array.from(listaOpc.children).forEach((boton, i) => {
        const esta = pregunta.opciones[i].id === opcionId;
        boton.classList.toggle('elegida', esta);
        boton.setAttribute('aria-pressed', String(esta));
      });

      btnSig.disabled = false;
    }

    /** Precarga la foto del siguiente trabajo para que entre sin espera. */
    function precargarSiguienteFoto() {
      const siguiente = pasos.slice(indice + 1).find((p) => p.bloque.id !== bloqueActual);
      if (!siguiente) return;
      const imagen = new Image();
      imagen.src = 'assets/img/' + siguiente.bloque.imagen;
    }

    /* ---------------------------------------------------- Navegación --- */

    btnAnt.addEventListener('click', () => {
      if (indice === 0) return;
      indice -= 1;
      pintar();
    });

    btnSig.addEventListener('click', async () => {
      const paso = pasos[indice];
      const opcionId = elegidas[paso.pregunta.id];
      if (!opcionId) return; // no se avanza sin responder

      ocupado(true);
      try {
        // Cada respuesta se guarda al avanzar, no todas al final.
        await guardarRespuesta(paso.pregunta.id, opcionId, momento);
        limpiarError(avisos);

        if (indice === pasos.length - 1) {
          if (momento === 'antes') {
            // Termina la primera vuelta: toca conocer a las mujeres.
            window.location.href = 'historias.html?v=5';
          } else {
            await completarSesion();
            window.location.href = 'revelacion.html?v=5';
          }
          return;
        }

        indice += 1;
        pintar();
      } catch (error) {
        mostrarError(avisos, error);
      } finally {
        ocupado(false);
      }
    });

    /** Bloquea los botones mientras se habla con el servidor. */
    function ocupado(estado) {
      btnSig.disabled = estado || !elegidas[pasos[indice].pregunta.id];
      btnAnt.disabled = estado || indice === 0;
      spinnerSig.classList.toggle('oculto', !estado);
    }

    iniciar();
  </script>
</body>
</html>
